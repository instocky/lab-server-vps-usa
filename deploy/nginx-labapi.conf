# /etc/nginx/sites-available/labapi   (nginx 1.18, jammy)
# certbot --nginx -d lab.antibumaga.ru добавил ssl-блок и редирект с :80
server {
	server_name lab.antibumaga.ru;

	# аутентификация — в приложении (bearer token), не здесь
	location / {
		proxy_pass http://127.0.0.1:18081;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_connect_timeout 5s;
		proxy_read_timeout 30s;
		proxy_send_timeout 30s;
	}

	listen 443 ssl; # managed by Certbot
	ssl_certificate /etc/letsencrypt/live/lab.antibumaga.ru/fullchain.pem; # managed by Certbot
	ssl_certificate_key /etc/letsencrypt/live/lab.antibumaga.ru/privkey.pem; # managed by Certbot
	include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
	if ($host = lab.antibumaga.ru) {
		return 301 https://$host$request_uri;
	} # managed by Certbot

	listen 80;
	server_name lab.antibumaga.ru;
	return 404; # managed by Certbot
}
